plugins {
	id 'java'
}

repositories {
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
	mavenLocal()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.emyrk.banktags.BankTagsPluginLauncher'

def generatedInventorySetupsDir = layout.buildDirectory.dir('generated/inventory-setups')

tasks.register('prepareInventorySetups', Exec) {
	inputs.file('scripts/prepare-inventory-setups.sh')
	inputs.dir('patches/inventory-setups')
	inputs.dir('vendor/inventory-setups/src/main')
	outputs.dir(generatedInventorySetupsDir)
	commandLine 'bash', 'scripts/prepare-inventory-setups.sh', generatedInventorySetupsDir.get().asFile.absolutePath
}

sourceSets {
	main {
		java.srcDir(generatedInventorySetupsDir.map { it.dir('java') })
		resources.srcDir(generatedInventorySetupsDir.map { it.dir('resources') })
	}
}

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
	testImplementation 'org.mockito:mockito-core:5.23.0'
	testImplementation 'com.google.inject.extensions:guice-testlib:4.1.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.emyrk.banktags'
// CI passes -Pversion=<gradle_version> (see .github/workflows/release.yml);
// local builds fall back to 0.0.0-dev.
version = project.hasProperty('version') && project.version != 'unspecified' ? project.version : '0.0.0-dev'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(11)
	}
}

tasks.named('compileJava') {
	dependsOn tasks.named('prepareInventorySetups')
}

tasks.named('processResources') {
	dependsOn tasks.named('prepareInventorySetups')
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

processResources {
	// runelite-plugin.properties lives at the repo root (Plugin Hub
	// convention); bake the build version into the copy shipped in the jar.
	from('LICENSES/inventory-setups-BSD-2-Clause.txt') {
		into 'META-INF/licenses'
	}
	from('runelite-plugin.properties')
	inputs.property('version', project.version)
	filesMatching('runelite-plugin.properties') {
		expand(version: project.version)
	}
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	// Same opens the official launcher passes the client; without them the
	// client dies on macOS with IllegalAccessError on
	// com.apple.eawt.FullScreenAdapter. Unknown packages are a no-op
	// elsewhere, so they're passed unconditionally.
	jvmArgs "-ea",
		"--add-opens", "java.base/java.net=ALL-UNNAMED",
		"--add-opens", "java.base/java.io=ALL-UNNAMED",
		"--add-opens", "java.desktop/com.apple.eawt=ALL-UNNAMED",
		"--add-opens", "java.base/java.lang=ALL-UNNAMED",
		"--add-opens", "java.base/java.lang.invoke=ALL-UNNAMED",
		"--add-opens", "java.desktop/sun.awt=ALL-UNNAMED",
		"--add-opens", "java.desktop/java.applet=ALL-UNNAMED",
		"--add-opens", "java.desktop/java.awt.event=ALL-UNNAMED",
		"-Dsun.java2d.metal=false",
		"-Dsun.java2d.opengl=true"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes(
			'Main-Class': pluginMainClass,
			'Multi-Release': true,
			'Add-Opens': 'java.base/java.lang java.base/java.lang.reflect java.base/java.net java.base/java.io'
		)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
